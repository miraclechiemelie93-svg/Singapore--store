<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment — Singapore Store</title><script src="https://js.paystack.co/v2/inline.js"></script><style>body{font-family:Arial;background:#fafafa;margin:0;display:grid;place-items:center;min-height:100vh}.box{background:#fff;padding:30px;border-radius:18px;border:1px solid #eee;max-width:500px;text-align:center}.btn{padding:12px 18px;border-radius:10px;border:0;background:#111;color:#fff;cursor:pointer}</style></head><body><div class="box"><h1>Complete your payment</h1><p id="msg">Opening secure Paystack checkout…</p><button class="btn" id="retry" style="display:none" onclick="pay()">Try again</button><p><a href="/">Return to store</a></p></div><script>
const qs=new URLSearchParams(location.search),accessCode=qs.get("access_code"),reference=qs.get("reference"),token=localStorage.getItem("token");
async function pay(){if(!accessCode||!reference||!token){document.getElementById("msg").textContent="Payment session is missing or expired.";return}try{const popup=new PaystackPop();popup.resumeTransaction(accessCode);document.getElementById("msg").textContent="Complete payment in the Paystack window. Do not close this page.";poll()}catch(e){document.getElementById("msg").textContent=e.message;document.getElementById("retry").style.display="inline-block"}}
async function poll(){let tries=0;const timer=setInterval(async()=>{tries++;try{const r=await fetch("/api/orders/verify",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify({reference})});const d=await r.json();if(r.ok&&d.success){clearInterval(timer);localStorage.removeItem("cart");document.getElementById("msg").innerHTML="Payment confirmed. Order #"+d.order.id+" has been placed.";return}}catch{}if(tries>60)clearInterval(timer)},3000)}
pay();
</script></body></html>
