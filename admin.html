<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Singapore Store Admin</title><style>body{font-family:Arial;margin:0;background:#fafafa;color:#111}.wrap{max-width:1100px;margin:30px auto;padding:0 18px}.card{background:#fff;border:1px solid #eee;border-radius:14px;padding:18px;margin:15px 0}input,select,button{padding:10px;border:1px solid #ddd;border-radius:9px}button{cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}@media(max-width:700px){.grid{grid-template-columns:1fr}}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #eee;text-align:left}</style></head><body><div class="wrap"><h1>Singapore Store Admin</h1><p><a href="/">← Store</a></p><div id="app">Loading…</div></div><script>
const token=localStorage.getItem("token");const api=async(u,o={})=>{o.headers={...(o.headers||{}),Authorization:"Bearer "+token};if(o.body&&typeof o.body!=="string"){o.headers["Content-Type"]="application/json";o.body=JSON.stringify(o.body)}const r=await fetch(u,o),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d};let products=[],orders=[];
async function init(){const me=await api("/api/me");if(me.role!=="admin")throw Error("Admin access required");[products,orders]=await Promise.all([api("/api/admin/products"),api("/api/admin/orders")]);draw()}
function draw(){document.getElementById("app").innerHTML=`<div class="grid"><div class="card"><h2>Add product</h2><input id="n" placeholder="Name"><br><br><input id="d" placeholder="Description"><br><br><input id="p" type="number" placeholder="Price"><br><br><input id="s" type="number" placeholder="Stock"><br><br><input id="i" placeholder="Image URL or emoji"><br><br><button onclick="add()">Add product</button></div><div class="card"><h2>Products</h2><table><tr><th>Product</th><th>Price</th><th>Stock</th><th></th></tr>${products.map(x=>`<tr><td>${x.name}</td><td>₦${x.price.toLocaleString()}</td><td>${x.stock}</td><td><button onclick="del(${x.id})">Hide</button></td></tr>`).join("")}</table></div></div><div class="card"><h2>Orders</h2><table><tr><th>#</th><th>Customer</th><th>Total</th><th>Status</th><th>Change</th></tr>${orders.map(x=>`<tr><td>${x.id}</td><td>${x.customer_name}<br>${x.email}</td><td>₦${x.total.toLocaleString()}</td><td>${x.status}</td><td><select onchange="status(${x.id},this.value)"><option value="">Select</option>${["processing","shipped","delivered","cancelled"].map(s=>`<option>${s}</option>`).join("")}</select></td></tr>`).join("")}</table></div>`}
async function add(){await api("/api/admin/products",{method:"POST",body:{name:n.value,description:d.value,price:Number(p.value),stock:Number(s.value),image_url:i.value}});location.reload()}
async function del(id){await api("/api/admin/products/"+id,{method:"DELETE"});location.reload()}
async function status(id,s){if(!s)return;await api("/api/admin/orders/"+id,{method:"PUT",body:{status:s}});location.reload()}
init().catch(e=>document.getElementById("app").textContent=e.message);
</script></body></html>
